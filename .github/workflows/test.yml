name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: "tests: offline, scripted and playbook models, no AWS"
        run: python -m pytest -q --cov=munshi --cov-report=term-missing
      - name: the demo, end to end
        run: |
          python -m munshi.run demo --model playbook --home /tmp/m
          card=$(python -m munshi.run cards --home /tmp/m --model playbook | awk '/never paid/ {print $2; exit}')
          python -m munshi.run decide "$card" report --home /tmp/m --model playbook
