<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munshi</title>
<link rel="stylesheet" href="munshi.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark">Munshi</span>
    <span class="who" id="who">Loading…</span>
    <span class="pill" title="No tool can move money, and a hook refuses any call outside the allow-list">Never moves money</span>
    <p class="replay" id="replay" hidden></p>
  </header>
  <main id="main" aria-live="polite"></main>
  <aside>
    <h2 class="section">What Munshi did</h2>
    <ul class="log" id="log"></ul>
    <p class="note">Every tool call, including refused ones, is written to <code>audit.jsonl</code>.
      Munshi reads bank messages on the phone. Only amounts, payees and times leave it.</p>
    <div class="bar"><button id="restart" type="button">Replay the afternoon</button></div>
    <p class="error" id="error" role="alert"></p>
  </aside>
</div>
<script src="munshi.js"></script>
<script src="replay.js"></script>
<script>
(function () {
  "use strict";
  var M = window.Munshi;

  // The recorded run on GitHub Pages: replayed here, nothing sent anywhere.
  function replayAdapter(data) {
    var offset = 0, current = null;
    var note = M.byId("replay");
    note.textContent = "A recorded run from " + data.recorded_at +
      ", replayed in your browser. The clock starts now; nothing you tap is sent anywhere.";
    note.hidden = false;
    return {
      now: function () { return Date.now() + offset; },
      start: function () {
        offset = M.parseWhen(data.initial.now).getTime() - Date.now();
        current = JSON.parse(JSON.stringify(data.initial));
        return current;
      },
      decide: function (card, choice) {
        var rec = (data.outcomes[card.id] || {})[choice];
        if (!rec) throw new Error("This choice was not recorded.");
        current = Object.assign({}, current, {
          cards: current.cards.map(function (c) { return c.id === card.id ? rec.card : c; }),
          audit: current.audit.concat(rec.audit)
        });
        return current;
      }
    };
  }

  var localAdapter = {
    start: function () {
      return fetch("/api/state").then(function (r) { return r.json(); })
        .then(function (j) { if (!j.ok) throw new Error(j.error); return j.data; });
    },
    decide: function (card, choice) { return M.post("/api/decide", { card: card.id, choice: choice }); },
    restart: function () { return M.post("/api/restart", {}); }
  };

  var adapter = window.MUNSHI_REPLAY ? replayAdapter(window.MUNSHI_REPLAY) : localAdapter;
  M.byId("restart").addEventListener("click", function () {
    M.busy(true);
    Promise.resolve((adapter.restart || adapter.start)()).then(function (s) { M.busy(false); M.render(s); }, M.fail);
  });
  M.mount(adapter).catch(M.fail);
})();
</script>
</body>
</html>
